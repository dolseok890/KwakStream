name: iOS Simulator
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version folder, e.g. v0.1.3 (empty = root ios folder)'
        required: false
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Locate source
        id: source
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$REQUESTED_VERSION"
          if [[ -z "$VERSION" && "$GITHUB_REF_TYPE" == tag ]]; then VERSION="$GITHUB_REF_NAME"; fi
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo 'Invalid version' >&2; exit 1; fi
          if [[ -n "$VERSION" && -f "$VERSION/ios/project.yml" ]]; then ROOT="$VERSION";
          elif [[ -f ios/project.yml ]]; then ROOT=.;
          else echo 'iOS source not found for version' >&2; exit 1; fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen and generate project
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.root }}
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd "$SOURCE_ROOT/ios"
          xcodegen generate
      - name: Select and boot simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime, devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Run simulator tests and record video
        env:
          SIM_ID: ${{ steps.simulator.outputs.id }}
          SOURCE_ROOT: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/captures"
          xcrun simctl io "$SIM_ID" recordVideo "$RUNNER_TEMP/captures/simulator.mp4" &
          VIDEO_PID=$!
          trap 'kill -INT "$VIDEO_PID" 2>/dev/null || true; wait "$VIDEO_PID" 2>/dev/null || true' EXIT
          cd "$SOURCE_ROOT/ios"
          xcodebuild test -project KwakStream.xcodeproj -scheme KwakStream -destination "platform=iOS Simulator,id=$SIM_ID" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/KwakStream.xcresult" CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/KwakStream.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/KwakStream.xcresult" --output-path "$RUNNER_TEMP/captures/attachments" || echo 'Screenshot attachment export failed; inspect xcresult.'
          fi
      - name: Upload captures and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: |
            ${{ runner.temp }}/captures
            ${{ runner.temp }}/KwakStream.xcresult
          if-no-files-found: warn
          retention-days: 30
