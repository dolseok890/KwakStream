name: Android Camera2 Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify flat source / version
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/java/kr/kwakstream/app/Camera2Controller.kt
          VERSION=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([0-9][0-9.]*\)".*/v\1/p' app/build.gradle.kts | head -n 1)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "Tag/version mismatch: $GITHUB_REF_NAME != $VERSION" >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KwakStream-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
