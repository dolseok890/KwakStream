name: KwakStream
options:
  bundleIdPrefix: live.kwak
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.15"
    CURRENT_PROJECT_VERSION: "16"
targets:
  KwakStream:
    type: application
    platform: iOS
    sources: [KwakStream]
    info:
      path: KwakStream/Info.plist
      properties:
        NSCameraUsageDescription: 카메라 미리보기를 표시하려면 카메라 권한이 필요합니다.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.kwak.stream
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: KwakStream
        GENERATE_INFOPLIST_FILE: NO
  KwakStreamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KwakStreamUITests]
    dependencies:
      - target: KwakStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.kwak.stream.uitests
schemes:
  KwakStream:
    build:
      targets:
        KwakStream: all
        KwakStreamUITests: [test]
    test:
      targets: [KwakStreamUITests]
